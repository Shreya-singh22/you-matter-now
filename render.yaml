services:
  - type: web
    name: you-matter-now-backend
    runtime: python
    plan: free
    rootDir: backend
    healthCheckPath: /health

    # No torch here. Retrieval uses Chroma's bundled ONNX MiniLM, and the
    # index is prebuilt by build_index.py and committed, so the server only
    # ever embeds one question at a time (~350MB peak, measured).
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"

      # Signs the JWTs. Render generates one; rotating it logs everyone out.
      - key: SECRET_KEY
        generateValue: true

      # Set by hand in the Render dashboard - never commit it.
      - key: GROQ_API_KEY
        sync: false

      # Comma-separated origins allowed to call this API.
      # Set to your Vercel URL, e.g. https://you-matter-now.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false

      # Retrieval, grounded in the committed chroma_db index.
      # Set to "false" if memory ever becomes a problem - the chatbot keeps
      # working, just without grounding in the source document.
      - key: ENABLE_RAG
        value: "true"

      # Uncomment after creating a Postgres instance. Without it the app
      # falls back to SQLite, which Render wipes on every deploy.
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: you-matter-now-db
      #     property: connectionString

# Uncomment together with DATABASE_URL above to get durable storage.
# databases:
#   - name: you-matter-now-db
#     plan: free
